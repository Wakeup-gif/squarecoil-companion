name: Optimize Design userscript

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build optimized self-contained Design script
        run: python scripts/optimize_design_userscript.py

      - name: Validate JavaScript syntax
        run: node --check tampermonkey/US-Sign-Design-Job-Tools.user.js

      - name: Check diff
        run: git diff --check

      - name: Commit optimized Design script
        shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Design-Job-Tools.user.js; then
            echo "No Design userscript changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Design-Job-Tools.user.js
          git commit -m "Optimize Design Job Tools runtime v4.1.1"
          git push
