name: Patch Full UI v2.1.42
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Full UI v2.1.42
        run: python scripts/patch_full_ui_v2142.py
      - name: Verify
        run: |
          grep -q '@version      2.1.42' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'v2.1.42 LEFT SIDEBAR GLASS + ALIGNMENT POLISH' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'US-Sign-Full-UI-Theme-v2.1.42.user.js' <(find tampermonkey -maxdepth 1 -type f -printf '%f\n')
          node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme-v2.1.42.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js tampermonkey/US-Sign-Full-UI-Theme-v2.1.42.user.js
          git commit -m "Polish left sidebar glass and alignment v2.1.42"
          git pull --rebase origin main
          git push origin main
