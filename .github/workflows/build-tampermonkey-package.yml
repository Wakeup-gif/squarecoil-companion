name: Build Tampermonkey Package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_tampermonkey_package.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/US-Sign-Tampermonkey-Package-2026-08-14.zip packages/US-Sign-Tampermonkey-Package-2026-08-14.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Tampermonkey package 2026-08-14"
          git push
