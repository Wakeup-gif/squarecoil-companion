name: Patch Full UI Theme v2.1.26 topbar alignment
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_topbar_alignment_v2126.py
      - run: grep -q "@version      2.1.26" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "v2.1.26 TOPBAR GEOMETRY REPAIR" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No theme changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Repair topbar alignment in Full UI v2.1.26"
          git push
