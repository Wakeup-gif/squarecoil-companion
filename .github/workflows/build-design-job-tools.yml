name: Build Design Job Tools Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble userscript
        shell: bash
        run: |
          set -euo pipefail
          output="tampermonkey/US-Sign-Design-Job-Tools-v4.1.0.user.js"
          : > "$output"
          for file in tampermonkey/design-v4.1/part-*.txt; do
            cat "$file" >> "$output"
            printf '\n' >> "$output"
          done

      - name: Validate metadata and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          file="tampermonkey/US-Sign-Design-Job-Tools-v4.1.0.user.js"
          test "$(head -n 1 "$file")" = "// ==UserScript=="
          grep -q "@name         US Sign - Design Job Tools" "$file"
          grep -q "@version      4.1.0" "$file"
          grep -q "// ==/UserScript==" "$file"
          node --check "$file"
          echo "Lines: $(wc -l < "$file")"
          echo "Bytes: $(wc -c < "$file")"

      - name: Publish assembled installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Design-Job-Tools-v4.1.0.user.js
          if git diff --cached --quiet; then
            echo "Installer already current."
            exit 0
          fi
          git commit -m "Build Design Job Tools v4.1.0 installer"
          git push